<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bible Categories Accordion</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-50">
    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-6 md:p-8">
      <header class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-indigo-700">
          Bible Question Topics
        </h1>
        <p class="text-gray-500 mt-2">
          Select a topic below to expand and view questions and answers.
        </p>
      </header>

      <div id="loading-indicator" class="mt-6 text-center text-gray-500 hidden">
        Loading topics...
      </div>

      <div id="category-list-container" class="mt-6 space-y-3"></div>
    </div>

    <script>
      // 1. DATA (UPDATED: Answers is now an array of objects)
      const bibleData = [
        {
          question: "Who was the first king of Israel?",
          category: "Old Testament People",
          answers: [
            {
              text: "Saul",
              bibleReference: {
                name: "1 Samuel 10:1",
                url: "https://www.biblegateway.com/passage/?search=1+Samuel+10:1&version=NIV",
              },
              source: {
                name: "Bible Knowledge Book",
                url: "http://example.com/source/bkbook",
              },
            },
          ],
        },
        {
          question:
            "What are the first five books of the Bible collectively known as?",
          category: "General Knowledge",
          answers: [
            {
              text: "The Torah",
              bibleReference: {
                name: "Exodus 1:1",
                url: "https://www.biblegateway.com/passage/?search=Exodus+1%3A1&version=NIV",
              },
              source: {
                name: "General Bible Facts",
                url: "http://example.com/source/genfacts",
              },
            },
            {
              text: "The Pentateuch",
              bibleReference: {
                name: "Genesis 1:1",
                url: "https://www.biblegateway.com/passage/?search=Genesis+1:1&version=NIV",
              },
              source: {},
            },
          ],
        },
        {
          question: "Who was swallowed by a great fish?",
          category: "Old Testament Stories",
          answers: [
            {
              text: "Jonah",
              bibleReference: {
                name: "Jonah 1:17",
                url: "https://www.biblegateway.com/passage/?search=Jonah+1%3A17&version=NIV",
              },
              source: {},
            },
          ],
        },
        {
          question: "Which disciple denied Jesus three times?",
          category: "New Testament People",
          answers: [
            {
              text: "Peter",
              bibleReference: {
                name: "Matthew 26:69-75",
                url: "https://www.biblegateway.com/passage/?search=Matthew+26:69-75&version=NIV",
              },
              source: {},
            },
          ],
        },
        {
          question:
            "How many days and nights did it rain during the great flood?",
          category: "Old Testament Stories",
          answers: [
            {
              text: "40 days and 40 nights",
              bibleReference: {
                name: "Genesis 7:4",
                url: "https://www.biblegateway.com/passage/?search=Genesis+7:4&version=NIV",
              },
              source: {
                name: "Noah's Ark Guide",
                url: "http://example.com/source/noah",
              },
            },
          ],
        },
        {
          question: "What was the name of the garden where Adam and Eve lived?",
          category: "General Knowledge",
          answers: [
            {
              text: "The Garden of Eden",
              bibleReference: {
                name: "Genesis 2:8",
                url: "https://www.biblegateway.com/passage/?search=Genesis+2:8&version=NIV",
              },
              source: {},
            },
          ],
        },
      ];

      // 2. LOGIC

      const categoryListContainer = document.getElementById(
        "category-list-container"
      );
      const loadingIndicator = document.getElementById("loading-indicator");

      // MODIFIED: Function now iterates over the 'answers' array of objects.
      function renderQuestionAndAnswer(questionObj) {
        const { question, answers } = questionObj;

        let answersHtml = answers
          .map((answer) => {
            const { text, source, bibleReference } = answer;

            // Construct the Bible Reference HTML (Uses blue text and [Ref: Name] format)
            const bibleRefHtml =
              bibleReference && bibleReference.name && bibleReference.url
                ? `<a href="${bibleReference.url}" target="_blank" class="text-sm text-blue-600 hover:text-blue-800 hover:underline font-medium ml-2 whitespace-nowrap">[Ref: ${bibleReference.name}]</a>`
                : "";

            // Construct the Source HTML (Uses indigo text and (Source: Name) format)
            const sourceHtml =
              source && source.name && source.url
                ? `<a href="${source.url}" target="_blank" class="text-sm text-indigo-500 hover:text-indigo-700 hover:underline font-medium ml-2 whitespace-nowrap">(Source: ${source.name})</a>`
                : "";

            return `
                <div class="flex items-start mt-1 text-sm text-gray-600">
                    <strong class="text-indigo-600 mr-1 flex-shrink-0">Answer:</strong> 
                    <span class="text-green-700 font-medium">${text}</span>
                    <div class="ml-2 flex flex-wrap items-center">
                        ${bibleRefHtml}
                        ${sourceHtml}
                    </div>
                </div>
            `;
          })
          .join(""); // Join individual answer blocks

        return `
          <div class="question-3d">
              <h4 class="font-semibold text-gray-800 mb-2">
                  ${question}
              </h4>
              <div class="space-y-1">
                  ${answersHtml}
              </div>
          </div>
        `;
      }

      // Main Logic: Group, Render Accordions, and Attach Listeners
      function renderAccordions() {
        const categoriesMap = bibleData.reduce((acc, item) => {
          const category = item.category;
          if (!acc[category]) {
            acc[category] = [];
          }
          acc[category].push(item);
          return acc;
        }, {});

        let accordionsHtml = "";
        const sortedCategories = Object.keys(categoriesMap).sort();

        sortedCategories.forEach((category, index) => {
          const questions = categoriesMap[category];
          const panelId = `panel-${index}`;
          const count = questions.length;

          let questionsHtml = "";

          questions.forEach((questionObj) => {
            questionsHtml += renderQuestionAndAnswer(questionObj);
          });

          // Create the Category Accordion structure
          accordionsHtml += `
                <div class="accordion-item bg-white rounded-lg shadow overflow-hidden">
                    <button
                        class="accordion-toggle w-full flex justify-between items-center p-4 font-semibold text-left text-lg text-indigo-700 bg-indigo-100 hover:bg-indigo-200 transition duration-200 category-header-3d"
                        data-target="#${panelId}"
                    >
                        ${category} 
                        <span class="flex items-center space-x-2">
                            <span class="text-sm bg-indigo-500 text-white rounded-full px-3 py-1">${count}</span>
                            <svg class="w-5 h-5 transition-transform duration-300 transform category-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </span>
                    </button>
                    
                    <div id="${panelId}" class="accordion-panel hidden border-t border-indigo-300 p-2 space-y-2">
                        ${questionsHtml}
                    </div>
                </div>
            `;
        });

        categoryListContainer.innerHTML = accordionsHtml;

        document.querySelectorAll(".accordion-toggle").forEach((button) => {
          button.addEventListener("click", (event) => {
            const targetSelector = button.getAttribute("data-target");
            const panel = document.querySelector(targetSelector);
            const icon = button.querySelector(".category-icon");

            panel.classList.toggle("hidden");
            icon.classList.toggle("rotate-180");
          });
        });
      }

      // --- Initialization Function ---
      function initializeApp() {
        loadingIndicator.classList.add("hidden");

        if (bibleData && bibleData.length > 0) {
          renderAccordions();
        } else {
          categoryListContainer.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg">
                <p class="font-bold">Error: No questions found in the data block.</p>
            </div>`;
        }
      }

      window.onload = initializeApp;
    </script>
  </body>
</html>
